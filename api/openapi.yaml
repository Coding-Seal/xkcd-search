openapi: 3.0.3
info:
  title: Comics API
  version: 1.0.0
  description: API для работы с комиксами, авторизацией и обновлением данных.

servers:
  - url: https://api.example.com/api

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Credentials:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          example: user123
        password:
          type: string
          format: password
          example: secret

    OutputComic:
      type: object
      properties:
        id:
          type: integer
          example: 101
        title:
          type: string
          example: "Amazing Comic"
        img:
          type: string
          format: uri
          example: "https://example.com/images/101.png"

paths:
  /login:
    post:
      summary: Авторизация пользователя и получение JWT токена
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Успешная авторизация, токен возвращается в заголовке Authorization
          headers:
            Authorization:
              description: JWT токен авторизации
              schema:
                type: string
        '400':
          description: Неверный формат данных или отсутствуют login/password
        '403':
          description: Неверный пароль
        '404':
          description: Пользователь не найден

  /pics:
    get:
      summary: Поиск комиксов по названию
      parameters:
        - name: search
          in: query
          description: Поисковая фраза
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Список комиксов, соответствующих запросу (максимум 10)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutputComic'
        '404':
          description: Комиксы не найдены

  /update:
    post:
      summary: Обновление данных комиксов (требует авторизации)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Успешное обновление данных
        '401':
          description: Отсутствует или неверный токен авторизации
        '403':
          description: Отсутствует необходимые привилегии для вызова

  /comic/{id}:
    get:
      summary: Получение информации о конкретном комиксе по ID
      parameters:
        - name: id
          in: path
          description: Идентификатор комикса
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Информация о комиксе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputComic'
        '400':
          description: Некорректный ID комикса
        '404':
          description: Комикс не найден
